<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 300px; margin: 0; font: 13px/1.4 system-ui, sans-serif; }
  header { padding: 10px 12px; border-bottom: 1px solid #d0d7de; font-weight: 600; }
  main { padding: 10px 12px; display: grid; gap: 8px; }
  .muted { color: #656d76; font-size: 12px; }
  button { padding: 6px 10px; border: 1px solid #d0d7de; background: #f6f8fa; border-radius: 6px; cursor: pointer; font: inherit; }
  button:hover { background: #eaeef2; }
  #here { font-family: ui-monospace, monospace; font-size: 11px; word-break: break-all; }
</style>
</head>
<body>
<header>Sibling Buttons</header>
<main>
  <div>Origin: <span id="here" class="muted">…</span></div>
  <div id="status" class="muted"></div>
  <button id="open-options">Open settings</button>
  <button id="reload">Reload this tab</button>
</main>
<script src="popup.js"></script>
</body>
</html>
